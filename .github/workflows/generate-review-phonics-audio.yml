name: Generate Adult-Review Phonics Audio
# This runs only when the fixed generator/workflow changes, never on student input.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-review-phonics-audio.yml"
      - "scripts/generate_review_phonics_audio.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-review-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout this separate adult-review staging repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install open source offline audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak ffmpeg
      - name: Build short synthetic English word clips
        run: python3 scripts/generate_review_phonics_audio.py
      - name: Commit generated clips only to staging main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/review-english/*.mp3
          if git diff --cached --quiet; then
            echo "Review audio assets are already current."
          else
            git commit -m "Generate synthetic adult-review phonics mp3 samples"
            git push origin HEAD:main
          fi
