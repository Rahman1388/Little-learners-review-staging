name: Adult staging release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          node --check scripts/check-staging-release-gates.cjs
      - name: Verify files and preserve quality HOLD
        run: node scripts/check-staging-release-gates.cjs
